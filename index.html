<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>GHPlayer</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    /* 讓播放器「自動吃滿」你放它的 iframe/容器大小 */
    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }
  </style>
</head>
<body>
  <div id="player"></div>

<script>
  var ytPlayer = null;
  var pendingVolume = 30;

  function extractVideoId(text){
    if(!text) return "";
    text = text.trim();
    const idOnly = /^[a-zA-Z0-9_-]{11}$/;
    if(idOnly.test(text)) return text;

    try{
      const url = new URL(text);
      const v = url.searchParams.get("v");
      if(v && idOnly.test(v)) return v;

      const parts = url.pathname.split("/").filter(Boolean);
      const last = parts.length ? parts[parts.length - 1] : "";
      if(idOnly.test(last)) return last;
    }catch(e){}
    return "";
  }

  // YouTube IFrame Player API 載入
  var tag = document.createElement('script');
  tag.src = "https://www.youtube.com/iframe_api";
  var firstScriptTag = document.getElementsByTagName('script')[0];
  firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

  function onYouTubeIframeAPIReady(){
    var v = new URL(location.href).searchParams.get("v") || "";
    var id = extractVideoId(v);
    if(!id) return;
    ytPlayer = new YT.Player('player', {
      videoId: id,
      playerVars: {
        autoplay: 1,
        origin: location.origin
      },
      events: {
        onReady: onPlayerReady
      }
    });
  }

  function onPlayerReady(event){
    event.target.unMute();
    event.target.setVolume(pendingVolume);
    event.target.playVideo();
  }

  // 接收 content.js 傳來的浮動窗口音量
  window.addEventListener("message", function (event) {
    if (!event || !event.data || typeof event.data !== "object") return;
    if (event.data.action === "floatVolume") {
      pendingVolume = (event.data.value || 30) * 1;
      if (ytPlayer && ytPlayer.setVolume) {
        ytPlayer.setVolume(pendingVolume);
        ytPlayer.unMute();
      }
    }
    if (event.data.action === "floatMute") {
      if (ytPlayer && ytPlayer.mute) {
        ytPlayer.mute();
      }
    }
  });
</script>
</body>
</html>
