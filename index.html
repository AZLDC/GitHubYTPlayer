<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Player</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    /* 讓播放器「自動吃滿」你放它的 iframe/容器大小 */
    #player, #player iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }
  </style>
</head>
<body>
  <div id="player"></div>

<script>
  var ytPlayer = null;

  function extractVideoId(text){
    if(!text) return "";
    text = text.trim();
    const idOnly = /^[a-zA-Z0-9_-]{11}$/;
    if(idOnly.test(text)) return text;

    try{
      const url = new URL(text);
      const v = url.searchParams.get("v");
      if(v && idOnly.test(v)) return v;

      const parts = url.pathname.split("/").filter(Boolean);
      const last = parts[parts.length - 1] || "";
      if(idOnly.test(last)) return last;
    }catch(e){}
    return "";
  }

  function loadVideo(id){
    if(!id) return;
    if(ytPlayer){
      ytPlayer.loadVideoById(id);
      return;
    }
    ytPlayer = new YT.Player("player", {
      width: "100%",
      height: "100%",
      videoId: id,
      playerVars: {
        autoplay: 1,
        mute: 1,
        playsinline: 1,
        origin: location.origin
      },
      events: {
        onReady: function(e){
          e.target.playVideo();
        }
      }
    });
  }

  /* ── 浮動窗口音量控制 ── */
  var _floatVolume = 30;
  var _wasMaximized = false;
  var _THRESHOLD = 40;

  function _isMaximized(){
    return (screen.availWidth - window.outerWidth) <= _THRESHOLD &&
           (screen.availHeight - window.outerHeight) <= _THRESHOLD;
  }

  function _applyVolume(){
    if(!ytPlayer) return;
    ytPlayer.unMute();
    ytPlayer.setVolume(Math.max(0, Math.min(100, _floatVolume)));
  }

  function _applyMute(){
    if(!ytPlayer) return;
    ytPlayer.mute();
  }

  function _checkWindowState(){
    var maximized = _isMaximized();
    if(!maximized && _wasMaximized){
      // 從最大縮小到指定大小 → 套用音量
      _applyVolume();
    } else if(maximized && !_wasMaximized){
      // 關閉指令，準備放到最大 → mute
      _applyMute();
    }
    _wasMaximized = maximized;
  }

  window.addEventListener("resize", _checkWindowState);

  // 初始狀態
  _wasMaximized = _isMaximized();
  if(!_wasMaximized) _applyVolume();

  /* ── 接收外部 postMessage 指令來控制播放器 ── */
  window.addEventListener("message", function(e){
    if(!e.data || typeof e.data !== "object") return;
    var action = e.data.action;
    // 接收插件傳來的浮動窗口音量值
    if(action === "floatVolume" && typeof e.data.value === "number"){
      _floatVolume = Math.max(0, Math.min(100, e.data.value));
      if(!_wasMaximized && ytPlayer) _applyVolume();
      return;
    }
    if(!ytPlayer) return;
    if(action === "setVolume" && typeof e.data.value === "number"){
      ytPlayer.unMute();
      ytPlayer.setVolume(Math.max(0, Math.min(100, e.data.value)));
    } else if(action === "mute"){
      ytPlayer.mute();
    } else if(action === "unmute"){
      ytPlayer.unMute();
    } else if(action === "play"){
      ytPlayer.playVideo();
    } else if(action === "pause"){
      ytPlayer.pauseVideo();
    } else if(action === "load" && e.data.videoId){
      var vid = extractVideoId(e.data.videoId);
      if(vid) ytPlayer.loadVideoById(vid);
    }
  });

  /* ── 載入 YouTube IFrame API ── */
  var tag = document.createElement("script");
  tag.src = "https://www.youtube.com/iframe_api";
  document.head.appendChild(tag);

  var _videoId = extractVideoId(new URL(location.href).searchParams.get("v") || "");

  function onYouTubeIframeAPIReady(){
    if(_videoId) loadVideo(_videoId);
  }
</script>
</body>
</html>
